<text x="524.9" y="436" font-size="11.5" fill="#243029">mq</text>
<rect x="556" y="422" width="47" height="20" rx="5" fill="#ffffff" stroke="#dfe5e1"/>
<text x="567.8" y="436" font-size="11.5" fill="#243029">test</text>
<text x="190" y="488" font-size="11.5" fill="#5f6f66">只允许依赖 common-core；靠 AutoConfiguration.imports 被装配（143 文件 / 9,062 行）</text>
<text x="28" y="540" font-size="11.5" fill="#5f6f66">依赖方向：接入 → 平台 → 应用 → 基础，基础层不得反向引用；59 个 pom 逐一核验，违规 0 处。</text>
