<text x="256.8" y="436" font-size="11.5" fill="#243029">web</text>
<rect x="295" y="422" width="73" height="20" rx="5" fill="#ffffff" stroke="#dfe5e1"/>
<text x="306.1" y="436" font-size="11.5" fill="#243029">security</text>
<rect x="376" y="422" width="54" height="20" rx="5" fill="#ffffff" stroke="#dfe5e1"/>
<text x="387.6" y="436" font-size="11.5" fill="#243029">redis</text>
<rect x="438" y="422" width="67" height="20" rx="5" fill="#ffffff" stroke="#dfe5e1"/>
