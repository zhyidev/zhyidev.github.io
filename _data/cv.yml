        summary: 作为主要后端开发，完成后端整体设计与实现。
        highlights:
          - "架构与治理：14 个 Spring Boot 微服务 + 7 个公共库的 Maven 多模块工程，BOM 统一依赖版本，Nacos 注册配置，Gateway 统一路由 / JWT 校验 / 限流 / 链路 ID，14 个服务接入统一响应与错误码契约。"
          - "交易链路：实现「下单（服务端快照）→ 库存预占 / 确认 / 释放 → 钱包扣款 → 支付回调」闭环；request_id 幂等 + 状态机 CAS + 乐观锁，防重复下单、重复扣款与超卖；30 分钟未支付自动关单释放预占库存，台账对账。"
          - "消息可靠性：以 Outbox + 消费侧幂等状态机（claim 租约、重试、死信）封装 RocketMQ，解决「业务落库成功、消息发送失败」；订单、钱包、知识库事件可恢复调度。"
          - "RAG 检索：Tika 解析 → 1200 / 200 重叠分块 → 向量化 → Elasticsearch + pgvector 双路召回 → RRF（1/(60+rank)）融合 → 带文档版本引用的回答（SSE），评估集校验证据覆盖率与拒答。"
          - "工程质量：46 个 Flyway「仅向前」迁移脚本 + 启动校验；CI 执行 mvn verify、JaCoCo 覆盖率门禁、SBOM 与 Trivy；维护 144 个测试类 / 22 个集成测试，修复 50+ 处缺陷并定位 RocketMQ 消费并发失败根因。"

